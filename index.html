<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Pipeline Voice</title>
<style>
:root {
  --void: #02060d; --glass: rgba(6, 18, 34, 0.82); --line: rgba(120, 225, 255, 0.28);
  --ink: #e2f6ff; --soft: #9fc3d4; --arc: #62e6ff; --gold: #ffd46e; --warn: #ffab7a;
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: radial-gradient(circle at 50% 30%, #071a2e 0%, var(--void) 70%); color: var(--ink); font-family: var(--font); }
body { display: grid; justify-items: center; gap: 16px; padding: 20px 16px 24px; }
h1 { margin: 0; font: 600 13px var(--mono); letter-spacing: 0.22em; text-transform: uppercase; color: var(--arc); }
.status { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--soft); text-align: center; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 8px var(--warn); flex: none; }
.status.ok .dot { background: #4dffa6; box-shadow: 0 0 8px #4dffa6; }
.talk { position: relative; width: 168px; height: 168px; border-radius: 50%; border: 1px solid var(--line); background: radial-gradient(circle at 50% 42%, rgba(98, 230, 255, 0.18), rgba(4, 14, 28, 0.9) 70%); color: var(--ink); font: 600 13px var(--mono); letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; }
.talk::before { content: ""; position: absolute; inset: -9px; border-radius: 50%; border: 1px dashed rgba(98, 230, 255, 0.4); }
.talk:focus-visible { outline: 2px solid var(--arc); outline-offset: 6px; }
.talk[aria-pressed="true"], .talk.live { border-color: var(--arc); box-shadow: 0 0 40px rgba(98, 230, 255, 0.45), inset 0 0 30px rgba(98, 230, 255, 0.25); }
.talk.live::before { animation: spin 6s linear infinite; border-color: var(--arc); }
.talk:disabled { opacity: 0.45; cursor: not-allowed; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .talk.live::before { animation: none; } }
.keep { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--soft); }
.keep input { width: 18px; height: 18px; accent-color: var(--arc); }
.heard { min-height: 1.4em; max-width: 340px; text-align: center; font-size: 15px; color: var(--ink); }
.heard.interim { color: var(--soft); font-style: italic; }
.log { width: min(360px, 100%); list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; max-height: 40vh; overflow-y: auto; }
.log li { padding: 8px 10px; border: 1px solid var(--line); background: var(--glass); font-size: 14px; line-height: 1.35; }
.log li b { display: block; font: 600 10.5px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 2px; }
.log li.you b { color: var(--arc); }
.log li.orbs b { color: var(--gold); }
.log li.err { border-color: rgba(255, 171, 122, 0.5); }
.log li.err b { color: var(--warn); }
.hint { max-width: 340px; text-align: center; font-size: 12.5px; color: var(--soft); margin: 0; }
</style>
</head>
<body>
  <h1>Pipeline Voice</h1>
  <div class="status" id="status" role="status" aria-live="polite"><span class="dot" aria-hidden="true"></span><span id="status-text">Connecting to Pipeline Orbs…</span></div>
  <button class="talk" id="talk" type="button" aria-pressed="false" aria-describedby="talk-hint">Hold to talk</button>
  <p class="hint" id="talk-hint">Hold the button (or Space) while you speak, then let go.</p>
  <label class="keep"><input type="checkbox" id="keep"> Keep listening</label>
  <div class="heard" id="heard" aria-live="polite"></div>
  <ul class="log" id="log" aria-label="Conversation"></ul>
<script>
(() => {
  "use strict";
  // This window only listens and passes what you say to the Pipeline Orbs window that opened it.
  // It never sees your deals; Pipeline Orbs runs each request and sends back a short reply.
  const $ = s => document.querySelector(s);
  const talk = $("#talk"), keep = $("#keep"), heard = $("#heard"), log = $("#log"), statusEl = $("#status"), statusText = $("#status-text");
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const opener = window.opener;
  let ready = false, rec = null, listening = false, holding = false, paused = false, seq = 0, buffer = "";

  const setStatus = (text, ok) => { statusText.textContent = text; statusEl.classList.toggle("ok", !!ok); };
  const add = (who, text, cls) => {
    const li = document.createElement("li"); li.className = cls;
    const b = document.createElement("b"); b.textContent = who; li.append(b, document.createTextNode(text));
    log.prepend(li);
  };
  const send = msg => { try { opener.postMessage(Object.assign({ pv: 1 }, msg), "*"); } catch (e) { setStatus("Lost the connection to Pipeline Orbs. Open this window again from the Voice button.", false); } };

  if (!SR) { talk.disabled = true; keep.disabled = true; setStatus("This browser can't listen. Use Chrome or Edge.", false); }
  if (!opener) { talk.disabled = true; keep.disabled = true; setStatus("Open this window with the Voice button in Pipeline Orbs.", false); return; }

  // Handshake: say hello until Pipeline Orbs answers.
  const hello = setInterval(() => { if (ready) return clearInterval(hello); if (opener.closed) { clearInterval(hello); setStatus("Pipeline Orbs was closed.", false); return; } send({ type: "hello" }); }, 1000);
  send({ type: "hello" });

  window.addEventListener("message", e => {
    if (e.source !== opener) return; // only the window that opened this one
    const m = e.data || {}; if (m.pv !== 1) return;
    if (m.type === "ready") { ready = true; setStatus("Connected to Pipeline Orbs", true); }
    if (m.type === "reply") add("Pipeline Orbs", String(m.text || ""), m.error ? "orbs err" : "orbs");
    if (m.type === "speaking") { paused = !!m.on; if (paused) stop(); else if (keep.checked) start(); }
  });
  setInterval(() => { if (opener.closed) { setStatus("Pipeline Orbs was closed.", false); talk.disabled = true; keep.disabled = true; stop(); } }, 2000);

  function make() {
    const r = new SR(); r.lang = "en-US"; r.interimResults = true; r.continuous = true; r.maxAlternatives = 1;
    r.onresult = e => {
      let interim = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) buffer += (buffer ? " " : "") + t.trim(); else interim += t;
      }
      heard.textContent = (buffer + " " + interim).trim(); heard.classList.toggle("interim", !!interim);
      if (keep.checked && buffer && !interim) flush();
    };
    r.onerror = e => {
      if (e.error === "no-speech" || e.error === "aborted") return;
      add("Microphone", e.error === "not-allowed" ? "The microphone is blocked for this page. Allow it in Chrome's address bar, then try again." : "Listening stopped (" + e.error + ").", "err");
      keep.checked = false; holding = false; talk.setAttribute("aria-pressed", "false");
    };
    r.onend = () => { listening = false; talk.classList.remove("live"); if (keep.checked && !paused) setTimeout(start, 250); };
    return r;
  }
  function start() {
    if (!SR || listening || paused || talk.disabled) return;
    rec = rec || make();
    try { rec.start(); listening = true; talk.classList.add("live"); } catch (e) { /* already running */ }
  }
  function stop() { if (rec && listening) { try { rec.stop(); } catch (e) { /* already stopped */ } } }
  function flush() {
    const text = buffer.trim(); buffer = ""; if (!text) return;
    heard.textContent = ""; heard.classList.remove("interim");
    add("You", text, "you");
    if (!ready) { add("Pipeline Orbs", "Not connected yet. Keep the Pipeline Orbs tab open.", "orbs err"); return; }
    send({ type: "heard", id: ++seq, text });
  }

  // Hold to talk (mouse, touch or Space/Enter).
  const down = () => { if (keep.checked || talk.disabled) return; holding = true; buffer = ""; talk.setAttribute("aria-pressed", "true"); start(); };
  const up = () => { if (!holding) return; holding = false; talk.setAttribute("aria-pressed", "false"); stop(); setTimeout(flush, 350); };
  talk.addEventListener("pointerdown", e => { e.preventDefault(); talk.setPointerCapture(e.pointerId); down(); });
  talk.addEventListener("pointerup", up); talk.addEventListener("pointercancel", up);
  talk.addEventListener("keydown", e => { if ((e.key === " " || e.key === "Enter") && !e.repeat) { e.preventDefault(); down(); } });
  talk.addEventListener("keyup", e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); up(); } });

  keep.addEventListener("change", () => {
    talk.textContent = keep.checked ? "Listening" : "Hold to talk";
    document.getElementById("talk-hint").textContent = keep.checked ? "Just talk. Each pause sends what you said. Untick to stop." : "Hold the button (or Space) while you speak, then let go.";
    if (keep.checked) { buffer = ""; start(); } else stop();
  });
})();
</script>
</body>
</html>
